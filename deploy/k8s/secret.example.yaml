# Example Secret for AnkaLoop runtime configuration.
#
# DO NOT apply this file directly and DO NOT commit real credentials.
# Copy it to secret.yaml (gitignored), fill in real values, then apply:
#   cp deploy/k8s/secret.example.yaml deploy/k8s/secret.yaml
#   kubectl apply -f deploy/k8s/secret.yaml
#
# Or create it imperatively:
#   kubectl -n ankaloop create secret generic ankaloop-env \
#     --from-literal=OPENAI_API_KEY='<your-api-key>' \
#     --from-literal=ANKA_CHAT_MODEL='<model-name>' \
#     --from-literal=ANKA_OPENAI_BASE='https://your-openai-compatible-endpoint/v1'
#
# All keys are injected as environment variables (envFrom: secretRef) and are
# consumed by the gmi-entrypoint:
#   OPENAI_API_KEY      (required) API key for the OpenAI-compatible provider.
#                       GMI_MAAS_API_KEY is also accepted and mapped to it.
#   ANKA_CHAT_MODEL     (required) Chat model name.
#                       GMI_MODELS is also accepted (first entry wins).
#   ANKA_OPENAI_BASE    (optional) Provider base URL; the entrypoint derives it
#                       from GMI_MAAS_BASE_URL.
#   ANKA_TELEGRAM_BOT_TOKEN / ANKA_TELEGRAM_ALLOWED_USERS (optional) enable the
#                       Telegram polling bot. Single replica only.
apiVersion: v1
kind: Secret
metadata:
  name: ankaloop-env
  namespace: ankaloop
  labels:
    app: ankaloop
type: Opaque
stringData:
  OPENAI_API_KEY: "<your-api-key>"
  ANKA_CHAT_MODEL: "<your-chat-model>"
  ANKA_OPENAI_BASE: "https://your-openai-compatible-endpoint/v1"
  ANKA_TELEGRAM_BOT_TOKEN: "<your-telegram-bot-token>"
  ANKA_TELEGRAM_ALLOWED_USERS: "<your-telegram-user-id>"
  ANKA_TELEGRAM_ADMIN_USERS: "<your-telegram-admin-user-id>"
